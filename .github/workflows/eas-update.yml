name: EAS Update (OTA)

# Push a JavaScript-only update over-the-air to already-installed builds — no
# rebuild, no TestFlight, live on the next app launch. Trigger it from GitHub:
# Actions → "EAS Update (OTA)" → Run workflow (pick your feature branch as the
# source, and the channel to publish to). Requires an EXPO_TOKEN repo secret.
#
# Deliberately manual (not on every push): OTA only ships changes that DON'T touch
# native code. Anything that adds/removes a native module, edits native config
# (app.json ios/android, permissions, plugins), or bumps the Expo SDK still needs
# a full "EAS Build" — those bump the runtime version, and an incompatible update
# simply won't be delivered to an old build (safe by design; it can't crash it).

on:
  workflow_dispatch:
    inputs:
      message:
        description: What changed (shown in the update history)
        type: string
        default: JS update
      channel:
        description: Channel to publish to (production = TestFlight / App Store builds)
        type: choice
        options: [production, preview]
        default: production

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::Add an EXPO_TOKEN repo secret first (Expo dashboard → Account settings → Access tokens)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Channels and branches share a name by default (channel "production" points
      # to branch "production"), so publishing to the branch reaches builds on that
      # channel.
      #
      # EXPO_PUBLIC_* vars are inlined into the JS bundle at export time, so they
      # MUST be present here too — otherwise the OTA ships a bundle with no Supabase
      # / AI config and overwrites a good build's config. These mirror the values in
      # eas.json's build.production.env (all client-public: the Supabase key is a
      # publishable key, the rest are public URLs).
      - name: Publish OTA update
        env:
          EXPO_PUBLIC_SUPABASE_URL: "https://oybkykeoatfgcfqgaqpl.supabase.co"
          EXPO_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_yq-VQEcUYjYAHDlYqd_4jQ_CFxawxdY"
          EXPO_PUBLIC_IDENTIFY_URL: "https://clip-it-rose.vercel.app/api/identify"
        run: eas update --branch ${{ inputs.channel }} --message "${{ inputs.message }}" --non-interactive
