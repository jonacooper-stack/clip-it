name: EAS Build

# Build the native app on Expo's servers WITHOUT a local machine. Trigger it from
# GitHub: Actions tab → "EAS Build" → Run workflow → pick platform + profile.
# Requires an EXPO_TOKEN repo secret (Expo dashboard → Account settings → Access
# tokens). The install link appears in the run log and in your Expo dashboard.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options: [ios, android]
        default: ios
      profile:
        description: Build profile (preview = shareable install link)
        type: choice
        options: [preview, production]
        default: preview

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::Add an EXPO_TOKEN repo secret first (Expo dashboard → Account settings → Access tokens)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build
        run: eas build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --non-interactive
