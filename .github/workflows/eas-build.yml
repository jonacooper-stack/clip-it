name: EAS Build

# Build the native app on Expo's servers WITHOUT a local machine. Trigger it from
# GitHub: Actions tab → "EAS Build" → Run workflow → pick platform + profile.
# Requires an EXPO_TOKEN repo secret (Expo dashboard → Account settings → Access
# tokens). The install link appears in the run log and in your Expo dashboard.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options: [ios, android]
        default: ios
      profile:
        description: Build profile (production = TestFlight/App Store)
        type: choice
        options: [preview, production]
        default: production
      submit:
        description: Submit the finished build to TestFlight (iOS)
        type: choice
        options: ['no', 'yes']
        default: 'no'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Mapped here so the step `if` can detect whether the iOS signing key is set.
      # ASC_API_KEY_P8 = the raw .p8 contents (easiest); ASC_API_KEY_BASE64 = base64 of it.
      ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
      ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
    steps:
      - name: Check EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::Add an EXPO_TOKEN repo secret first (Expo dashboard → Account settings → Access tokens)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # For iOS, materialize the App Store Connect API key (.p8) from a base64
      # secret so EAS can manage signing credentials non-interactively. Skips
      # cleanly when the secret isn't set (e.g. Android builds, or before setup).
      - name: Prepare App Store Connect API key (iOS)
        if: ${{ inputs.platform == 'ios' && (env.ASC_API_KEY_P8 != '' || env.ASC_API_KEY_BASE64 != '') }}
        run: |
          if [ -n "$ASC_API_KEY_P8" ]; then
            printf '%s' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/asc_api_key.p8"
          else
            printf '%s' "$ASC_API_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/asc_api_key.p8"
          fi
          echo "EXPO_ASC_API_KEY_PATH=$RUNNER_TEMP/asc_api_key.p8" >> "$GITHUB_ENV"

      - name: Build
        env:
          # Consumed by EAS only when present; harmless/no-op for Android builds.
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPO_APPLE_TEAM_TYPE: ${{ secrets.APPLE_TEAM_TYPE }}
        run: eas build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --non-interactive

      # Upload the finished build to App Store Connect → TestFlight. Reuses the
      # ASC API key (the .p8 path is inherited from the Prepare step, or EAS uses
      # the key stored on your Expo account). Auto-creates the App Store app record
      # on first run.
      - name: Submit to TestFlight (iOS)
        if: ${{ inputs.submit == 'yes' && inputs.platform == 'ios' }}
        env:
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPO_APPLE_TEAM_TYPE: ${{ secrets.APPLE_TEAM_TYPE }}
        run: eas submit --platform ios --latest --non-interactive
